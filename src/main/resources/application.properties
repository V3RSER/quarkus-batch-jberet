# Datasource obtención de datos
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;encrypt=false;database=TEST
#quarkus.hibernate-orm.data.datasource=data
#;user=MyUserName;password=***;
# Datasource Jberet
quarkus.datasource."batch".db-kind=mssql
quarkus.datasource."batch".jdbc.url=jdbc:sqlserver://localhost:1433;encrypt=false;database=TEST
quarkus.datasource."batch".username=sa
quarkus.datasource."batch".password=sa
quarkus.jberet.repository.type=jdbc
quarkus.jberet.repository.jdbc.datasource=batch

# Configuración Jberet
quarkus.jberet.job."scheduler-job".cron=0/10 * * ? * * *
quarkus.jberet.job."scheduler-job".params.memory-data-limit=5000
quarkus.jberet.max-async=10

# Conexión data service
dataService-api/mp-rest/url=http://localhost:8081
dataService-api/mp-rest/scope=jakarta.inject.Singleton

